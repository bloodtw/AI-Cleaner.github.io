<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✨ AI 清潔排班神器</title>
  <style>
    :root {
      --system-blue: #007AFF;
      --system-bg: #F2F2F7;
      --card-bg: #FFFFFF;
      --text-primary: #000000;
      --text-secondary: #3C3C43;
      --border-color: #C6C6C8;
      --danger: #FF3B30;
      --success: #34C759;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--system-bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 100vw;
      margin: 0 auto;
      padding-bottom: 40px;
      overflow-x: hidden;
    }

    /* 在桌機或平板上顯示時，限制成手機大小置中 */
    @media (min-width: 480px) {
      .app-container {
        max-width: 430px; /* iPhone Pro Max 的寬度 */
        min-height: 100vh;
        background: var(--system-bg);
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
      }
      body {
        background-color: #E5E5EA;
        display: flex;
        justify-content: center;
      }
    }

    .ios-header {
      padding: 40px 16px 8px 16px;
    }

    .ios-header h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }

    .ios-header p {
      font-size: 15px;
      color: #8A8A8E;
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      color: #6D6D72;
      margin: 24px 16px 8px 16px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .ios-group {
      background: var(--card-bg);
      border-radius: 10px;
      margin: 0 16px;
      overflow: hidden;
    }

    .ios-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border-color);
      min-height: 48px;
      position: relative;
    }

    .ios-row:last-child {
      border-bottom: none;
    }

    .ios-row.column-layout {
      flex-direction: column;
      align-items: flex-start;
      padding: 12px 16px 16px 16px;
    }

    .ios-row.column-layout .ios-label {
      margin-bottom: 8px;
      width: 100%;
    }

    .ios-row.column-layout .ios-input {
      width: 100%;
      padding: 0;
      min-height: 80px;
      resize: none;
    }

    .ios-label {
      width: 85px;
      font-size: 17px;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .ios-input {
      flex-grow: 1;
      border: none;
      font-size: 17px;
      color: var(--text-secondary);
      background: transparent;
      outline: none;
      min-width: 0;
      font-family: inherit;
    }

    .ios-input::placeholder {
      color: #C7C7CC;
    }

    input[type="date"], input[type="time"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
    }

    .ios-button {
      display: block;
      width: calc(100% - 32px);
      margin: 24px 16px;
      padding: 14px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      text-align: center;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .ios-button:active {
      opacity: 0.7;
      transform: scale(0.98);
    }

    .ios-button-primary {
      background-color: var(--system-blue);
      color: white;
    }

    .ios-button-primary:disabled {
      background-color: #A1C6EA;
      cursor: not-allowed;
    }

    .ios-button-secondary {
      background-color: #E5E5EA;
      color: var(--system-blue);
    }

    .upload-area {
      padding: 24px 16px;
      text-align: center;
      transition: background-color 0.3s;
    }

    .upload-icon {
      font-size: 40px;
      margin-bottom: 12px;
      display: block;
    }

    .custom-file-upload {
      display: inline-block;
      color: var(--system-blue);
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    .image-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 16px 16px;
    }

    .image-preview img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 8px;
      border: 0.5px solid var(--border-color);
    }

    .status-message {
      text-align: center;
      font-size: 15px;
      margin: 8px 16px;
      min-height: 20px;
    }

    .status-message.success {
      color: var(--success);
    }

    .status-message.error {
      color: var(--danger);
    }

    .status-message.loading {
      color: var(--system-blue);
    }

    .required {
      color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="ios-header">
      <h1>排班神器</h1>
      <p>自動填寫表單並生成 Google 日曆事件</p>
    </div>

    <div class="section-title">API 設定</div>
    <div class="ios-group">
      <div class="ios-row">
        <label class="ios-label" for="apiKey">金鑰</label>
        <input type="password" id="apiKey" class="ios-input" placeholder="請輸入 Gemini API Key">
      </div>
    </div>

    <div class="section-title">步驟一：上傳預約圖</div>
    <div class="ios-group" id="dropZone">
      <div class="upload-area">
        <span class="upload-icon">📸</span>
        <label for="fileInput" class="custom-file-upload">選擇圖片...</label>
        <input type="file" id="fileInput" multiple accept="image/*">
        <p id="fileCount" style="margin-top: 8px; font-size: 13px; color: #8A8A8E;">未選擇任何檔案</p>
      </div>
      <div id="imagePreview" class="image-preview"></div>
    </div>

    <button id="aiButton" class="ios-button ios-button-primary" disabled>
      開始 AI 自動識別
    </button>
    <p id="statusMessage" class="status-message"></p>

    <div class="section-title">步驟二：確認欄位</div>
    <div class="ios-group">
      <div class="ios-row">
        <label class="ios-label" for="platform">平台</label>
        <input type="text" id="platform" class="ios-input" placeholder="例：大管家平台 或 幫棒平台">
      </div>
      <div class="ios-row">
        <label class="ios-label" for="region">區域</label>
        <input type="text" id="region" class="ios-input" placeholder="例：萬華">
      </div>
      <div class="ios-row">
        <label class="ios-label" for="customerName">姓名</label>
        <input type="text" id="customerName" class="ios-input" placeholder="例：趙怡如">
      </div>
      <div class="ios-row">
        <label class="ios-label" for="serviceType">類型</label>
        <input type="text" id="serviceType" class="ios-input" placeholder="例：定期清潔 或 居家清潔">
      </div>
      <div class="ios-row">
        <label class="ios-label" for="customerPhone">電話</label>
        <input type="tel" id="customerPhone" class="ios-input" placeholder="例：0916162448">
      </div>
    </div>

    <div class="section-title">時間與地點</div>
    <div class="ios-group">
      <div class="ios-row">
        <label class="ios-label" for="cleaningDate">日期 <span class="required">*</span></label>
        <input type="date" id="cleaningDate" class="ios-input">
      </div>
      <div class="ios-row">
        <label class="ios-label" for="startTime">開始 <span class="required">*</span></label>
        <input type="time" id="startTime" class="ios-input">
      </div>
      <div class="ios-row">
        <label class="ios-label" for="endTime">結束</label>
        <input type="time" id="endTime" class="ios-input">
      </div>
      <div class="ios-row">
        <label class="ios-label" for="cleaningAddress">地址</label>
        <input type="text" id="cleaningAddress" class="ios-input" placeholder="例：台北市">
      </div>
    </div>

    <div class="section-title">備註說明</div>
    <div class="ios-group">
      <div class="ios-row column-layout">
        <textarea id="notes" class="ios-input" placeholder="顧客留言與要求..."></textarea>
      </div>
    </div>

    <button id="calendarButton" class="ios-button ios-button-primary">
      📅 新增至 Google 日曆
    </button>
  </div>

  <script>
    let GoogleGenerativeAI;

    const apiKeyInput = document.getElementById('apiKey');
    const fileInput = document.getElementById('fileInput');
    const fileCount = document.getElementById('fileCount');
    const imagePreview = document.getElementById('imagePreview');
    const aiButton = document.getElementById('aiButton');
    const statusMessage = document.getElementById('statusMessage');
    const calendarButton = document.getElementById('calendarButton');

    // Load API key from local storage
    const savedApiKey = localStorage.getItem('geminiApiKey');
    if (savedApiKey) {
      apiKeyInput.value = savedApiKey;
    }

    apiKeyInput.addEventListener('change', (e) => {
      localStorage.setItem('geminiApiKey', e.target.value);
    });

    let uploadedFiles = [];

    const handleFiles = (files) => {
      uploadedFiles = Array.from(files).filter(file => {
        return file.type.startsWith('image/') || 
               file.name.match(/\.(jpg|jpeg|png|gif|webp|heic|heif)$/i) ||
               file.type === '';
      });
      if (uploadedFiles.length > 0) {
        fileCount.textContent = `已選擇 ${uploadedFiles.length} 個檔案`;
        aiButton.disabled = false;
        renderPreviews(uploadedFiles);
        statusMessage.textContent = '準備就緒，您可以點擊按鈕開始！';
        statusMessage.className = 'status-message loading';
        
        // Auto-trigger AI if API key is present
        if (apiKeyInput.value.trim()) {
           statusMessage.textContent = '偵測到圖片與 API Key，自動開始 AI 識別...';
           aiButton.click();
        }
      } else {
        fileCount.textContent = '未選擇任何檔案';
        aiButton.disabled = true;
        imagePreview.innerHTML = '';
      }
    };

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
    });

    // Drag and Drop support
    const dropZone = document.getElementById('dropZone');
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = '#E5E5EA';
    });

    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = 'transparent';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.backgroundColor = 'transparent';
      handleFiles(e.dataTransfer.files);
    });

    function renderPreviews(files) {
      imagePreview.innerHTML = '';
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = document.createElement('img');
          img.src = e.target.result;
          imagePreview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }

    async function fileToGenerativePart(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64Data = reader.result.split(',')[1];
          
          let mimeType = file.type;
          if (!mimeType) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'heic') mimeType = 'image/heic';
            else if (ext === 'heif') mimeType = 'image/heif';
            else if (ext === 'png') mimeType = 'image/png';
            else if (ext === 'webp') mimeType = 'image/webp';
            else mimeType = 'image/jpeg';
          }

          resolve({
            inlineData: {
              data: base64Data,
              mimeType: mimeType
            }
          });
        };
        reader.readAsDataURL(file);
      });
    }

    function simplifyServiceType(serviceType) {
      if (!serviceType) return '居家清潔';
      let s = serviceType.trim();

      if (s.includes('幫棒居家-居家清掃') || s.includes('居家清掃')) {
        s = s.replace(/幫棒居家-居家清掃/g, '居家清潔').replace(/居家清掃/g, '居家清潔');
      }
      if (s.includes('幫棒居家-小套房清潔')) {
        s = s.replace(/幫棒居家-小套房清潔/g, '小套房清潔');
      }
      if (s.includes('辦公室清潔-辦公室清潔')) {
        s = s.replace(/辦公室清潔-辦公室清潔/g, '辦公室清潔');
      }

      s = s.replace(/幫棒/g, '').trim();

      if (s.includes('-')) {
        const parts = s.split('-').map(p => p.trim()).filter(Boolean);
        if (parts.length === 2 && parts[0] === parts[1]) {
          s = parts[0];
        } else if (parts.length >= 2 && parts[0] === '居家' && parts[1] === '居家清潔') {
          s = '居家清潔';
        }
      }

      s = s.replace(/^[-_\s]+/, '').trim();
      return s || '居家清潔';
    }

    aiButton.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert('請先輸入 Gemini API Key');
        return;
      }

      try {
        aiButton.disabled = true;
        aiButton.textContent = '🔄 AI 識別中...';
        statusMessage.textContent = '正在分析圖片，請稍候...';
        statusMessage.className = 'status-message loading';

        if (!GoogleGenerativeAI) {
          const importWithTimeout = (url, timeoutMs = 4000) => {
            return Promise.race([
              import(url),
              new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), timeoutMs))
            ]);
          };

          try {
            const module = await importWithTimeout("https://esm.run/@google/generative-ai");
            GoogleGenerativeAI = module.GoogleGenerativeAI;
          } catch (importErr) {
            console.warn("esm.run failed, trying jsdelivr npm cdn...", importErr);
            try {
              const module = await importWithTimeout("https://cdn.jsdelivr.net/npm/@google/generative-ai/+esm");
              GoogleGenerativeAI = module.GoogleGenerativeAI;
            } catch (importErr2) {
              console.warn("jsdelivr npm failed, trying esm.sh...", importErr2);
              try {
                const module = await importWithTimeout("https://esm.sh/@google/generative-ai");
                GoogleGenerativeAI = module.GoogleGenerativeAI;
              } catch (importErr3) {
                console.error("All CDNs failed to load generative-ai", importErr3);
              }
            }
          }
        }
        
        if (!GoogleGenerativeAI) {
           throw new Error("無法加載 AI 模型模組，請檢查您的網路連線或稍後再試。");
        }

        const genAI = new GoogleGenerativeAI(apiKey);
        
        let targetModelName = "gemini-3.1-flash-lite"; 
        try {
          statusMessage.textContent = '正在獲取可用的 AI 模型列表...';
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3000);
          
          const modelsRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`, {
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          
          if (modelsRes.ok) {
            const modelsData = await modelsRes.json();
            const validModels = modelsData.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"));
            
            const preferred = validModels.find(m => m.name.endsWith("gemini-3.1-flash-lite")) ||
                              validModels.find(m => m.name.endsWith("gemini-3-flash")) || 
                              validModels.find(m => m.name.endsWith("gemini-3.0-flash")) ||
                              validModels.find(m => m.name.endsWith("gemini-1.5-flash"));
            
            if (preferred) {
              targetModelName = preferred.name.replace('models/', '');
              console.log("Dynamically selected model:", targetModelName);
            } else {
               targetModelName = "gemini-3.1-flash-lite"; 
            }
          }
        } catch (e) {
          console.warn("Failed to fetch model list or timed out, using fallback", e);
        }

        statusMessage.textContent = `正在使用 ${targetModelName} 分析圖片...`;
        const model = genAI.getGenerativeModel({ model: targetModelName }); 

        const imageParts = await Promise.all(uploadedFiles.map(fileToGenerativePart));

        const prompt = `
          這是一張或多張清潔預約的訂單或對話截圖。請幫我萃取以下資訊，並嚴格使用 JSON 格式輸出，不要有任何 Markdown 前綴。
          若找不到對應資訊則保留空白字串或預設格式。
          {
            "platform": "平台名稱 (嚴格判斷規則：1. 若圖片上方中間出現『工單明細』，請務必填入『大管家平台』；2. 若圖片中出現『幫棒』或『bounbang』字樣，請填入『幫棒平台』；3. 若皆無標示，請填入『平台』或其它識別到的平台名稱。請注意：填入的名稱不要包含中括號『【』或『】』)",
            "region": "區域 (例如：萬華、中山、信義)",
            "customerName": "客戶姓名 (例如：趙怡如、陳先生、王儷縉)",
            "serviceType": "清潔類型 (請從圖片文字中萃取並進行簡化與去重：若為『幫棒居家-居家清掃』請簡化為『居家清潔』；若為『幫棒居家-小套房清潔』請簡化為『小套房清潔』；若為『辦公室清潔-辦公室清潔』請簡化為『辦公室清潔』。若圖片中完全未標示任何清潔類型，請預設填入『居家清潔』。注意：務必將『幫棒』二字與重覆詞彙去除)",
            "cleaningDate": "清潔日期 (請轉換為 YYYY-MM-DD 格式，例如：2026-11-09)",
            "startTime": "開始時間 (請務必轉換為 24 小時制 HH:mm 格式。若原圖為下午、PM 或 1:00，請轉為 13:00，例如：08:00、13:00)",
            "endTime": "結束時間 (請務必轉換為 24 小時制 HH:mm 格式。若原圖為下午、PM 或 5:00，請轉為 17:00，例如：12:00、17:00)",
            "customerPhone": "客戶電話",
            "cleaningAddress": "清潔地址",
            "totalAmount": "每單總收入/金額 (特別說明：僅當圖片中出現『幫棒』或『bounbang』字樣時擷取金額，例如：1199元；若為大管家平台/工單明細請留空白『』)",
            "notes": "備註或要求（嚴格金額規定：只要圖片上方中間出現『工單明細』或為『大管家平台』，無論圖片中是否有顯示『原價』、『特價』或任何金額數字，絕對『不要擷取』金額，備註中『絕對不可出現任何金額與總收入』！只有『幫棒平台』(有幫棒/bounbang字樣)的圖片才要在備註最前面標明『總收入：XXXX元』。接著請將「完整地址」擷取並放在備註中，然後完整擷取並保留『客服留言』與『客人端留言』的所有細節。請注意：不要擷取「服務前一天，務必電聯或簡訊提醒客戶」及「若臨時無法服務，請盡速告知客服」這兩段文字）"
          }
        `;

        const result = await model.generateContent([prompt, ...imageParts]);
        const response = await result.response;
        let text = response.text();
        
        // Clean JSON text
        text = text.replace(/\`\`\`json/g, '').replace(/\`\`\`/g, '').trim();
        const data = JSON.parse(text);

        // Fill Form
        let pName = data.platform ? data.platform.replace(/[【】]/g, '').trim() : '平台';
        if (text.includes('工單明細')) {
          pName = '大管家平台';
        } else if (text.includes('幫棒') || (data.serviceType && data.serviceType.includes('幫棒'))) {
          pName = '幫棒平台';
        }
        document.getElementById('platform').value = pName;

        if(data.region) document.getElementById('region').value = data.region;
        if(data.customerName) document.getElementById('customerName').value = data.customerName;
        document.getElementById('serviceType').value = simplifyServiceType(data.serviceType);

        if(data.cleaningDate) {
          const dMatch = data.cleaningDate.match(/(\d{4})[-/.\s年]?(\d{1,2})[-/.\s月]?(\d{1,2})/);
          if (dMatch) {
            document.getElementById('cleaningDate').value = `${dMatch[1]}-${dMatch[2].padStart(2, '0')}-${dMatch[3].padStart(2, '0')}`;
          } else {
            document.getElementById('cleaningDate').value = data.cleaningDate;
          }
        }
        if(data.startTime) {
          const tMatch = data.startTime.match(/(\d{1,2}):(\d{2})/);
          if (tMatch) {
            document.getElementById('startTime').value = `${tMatch[1].padStart(2, '0')}:${tMatch[2]}`;
          } else {
            document.getElementById('startTime').value = data.startTime;
          }
        }
        if(data.endTime) {
          const tMatch = data.endTime.match(/(\d{1,2}):(\d{2})/);
          if (tMatch) {
            document.getElementById('endTime').value = `${tMatch[1].padStart(2, '0')}:${tMatch[2]}`;
          } else {
            document.getElementById('endTime').value = data.endTime;
          }
        }
        if(data.customerPhone) document.getElementById('customerPhone').value = data.customerPhone;
        if(data.cleaningAddress) document.getElementById('cleaningAddress').value = data.cleaningAddress;

        // Handle Total Amount for 幫棒
        let amt = data.totalAmount || '';
        if (pName === '幫棒平台' || text.includes('幫棒') || text.toLowerCase().includes('bounbang')) {
          if (!amt && data.notes) {
            const match = data.notes.match(/總收入[:：]?\s*([\$\d,]+元?)/);
            if (match) amt = match[1];
          }
          if (amt && !amt.includes('元') && /^\d+$/.test(amt.trim())) {
            amt += '元';
          }
        }

        let notesVal = data.notes || '';
        if (pName === '大管家平台' || text.includes('工單明細')) {
          notesVal = notesVal
            .replace(/總收入[:：]?\s*[\$\d,]+元?/g, '')
            .replace(/原價[:：]?\s*[\$\d,]+元?/g, '')
            .replace(/特價[:：]?\s*[\$\d,]+元?/g, '')
            .replace(/D\s*:\s*\d+小時.*?(元|$)/g, '')
            .replace(/[\$\d,]+元/g, '')
            .trim();
        } else if (pName === '幫棒平台' || text.includes('幫棒') || text.toLowerCase().includes('bounbang')) {
          if (amt) {
            notesVal = notesVal.replace(/總收入[:：]?\s*[\$\d,]+元?\n?/g, '').trim();
            notesVal = `總收入：${amt}\n${notesVal}`.trim();
          }
        }
        document.getElementById('notes').value = notesVal;

        statusMessage.textContent = '✅ AI 識別成功，已自動填表！';
        statusMessage.className = 'status-message success';

      } catch (error) {
        console.error('Error:', error);
        statusMessage.textContent = '❌ 識別失敗：' + error.message;
        statusMessage.className = 'status-message error';
      } finally {
        aiButton.disabled = false;
        aiButton.textContent = '開始 AI 自動識別';
      }
    });

    function parseDateString(rawDate) {
      if (!rawDate) return '';
      const match = rawDate.match(/(\d{4})[-/.\s年]?(\d{1,2})[-/.\s月]?(\d{1,2})/);
      if (match) {
        const y = match[1];
        const m = match[2].padStart(2, '0');
        const d = match[3].padStart(2, '0');
        return `${y}${m}${d}`;
      }
      return rawDate.replace(/\D/g, '');
    }

    function parseTimeString(rawTime) {
      if (!rawTime) return '';
      const match = rawTime.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (match) {
        const hh = match[1].padStart(2, '0');
        const mm = match[2];
        const ss = match[3] ? match[3].padStart(2, '0') : '00';
        return `${hh}${mm}${ss}`;
      }
      return '';
    }

    calendarButton.addEventListener('click', () => {
      let platform = (document.getElementById('platform').value || '平台').replace(/[【】]/g, '').trim();
      const region = document.getElementById('region').value || '';
      let serviceType = simplifyServiceType(document.getElementById('serviceType').value || '居家清潔');
      const customerName = document.getElementById('customerName').value || '';
      const customerPhone = document.getElementById('customerPhone').value || '';
      
      const title = `【${platform}】${region} | ${serviceType} | ${customerName} | ${customerPhone}`;
      
      const rawDate = document.getElementById('cleaningDate').value;
      const rawStart = document.getElementById('startTime').value;
      const rawEnd = document.getElementById('endTime').value;

      if (!rawDate || !rawStart || !rawEnd) {
        alert('請確保「日期」、「開始時間」與「結束時間」已填寫！');
        return;
      }

      const startDate = parseDateString(rawDate);
      const startTime = parseTimeString(rawStart);
      const endTime = parseTimeString(rawEnd);

      if (startDate.length !== 8 || startTime.length !== 6 || endTime.length !== 6) {
        alert('日期或時間格式有誤，請確認格式（例如：2026/11/09 的 13:00 至 17:00）');
        return;
      }

      let endDate = startDate;
      if (parseInt(startTime, 10) > parseInt(endTime, 10)) {
        const y = parseInt(startDate.substring(0, 4), 10);
        const m = parseInt(startDate.substring(4, 6), 10) - 1;
        const d = parseInt(startDate.substring(6, 8), 10);
        const nextDay = new Date(y, m, d + 1);
        const nextY = nextDay.getFullYear();
        const nextM = String(nextDay.getMonth() + 1).padStart(2, '0');
        const nextD = String(nextDay.getDate()).padStart(2, '0');
        endDate = `${nextY}${nextM}${nextD}`;
      }

      const dates = `${startDate}T${startTime}/${endDate}T${endTime}`;
      const location = document.getElementById('cleaningAddress').value || '';
      const notes = document.getElementById('notes').value || '';
      const details = customerPhone ? `電話：${customerPhone}\n備註：\n${notes}` : notes;

      const url = `https://calendar.google.com/calendar/render?action=TEMPLATE`
        + `&text=${encodeURIComponent(title)}`
        + `&dates=${dates}`
        + `&details=${encodeURIComponent(details)}`
        + `&location=${encodeURIComponent(location)}`
        + `&ctz=Asia/Taipei`;
      
      window.open(url, '_blank');
    });

  </script>
</body>
</html>
